---
- name: Deploy Jekyll demo app
  hosts: jekyll_hosts
  become: true

  vars:
    repo_url: "https://github.com/SimpleVM/simplevm-services-demo-jekyll.git"
    repo_version: "master"

    app_port: 3838
    base_url: "/jekyll_100"

    build_user: "{{ ansible_user }}"

    base_dir: "/srv/jekyll-demo"
    repo_dir: "{{ base_dir }}/repo"
    app_dir: "{{ repo_dir }}/app"
    site_dir: "{{ base_dir }}/site"
    build_dir: "{{ site_dir }}/{{ base_url }}"

  tasks:
    - name: Install system dependencies
      ansible.builtin.apt:
        name:
          - ruby-full
          - build-essential
          - zlib1g-dev
          - nginx
          - git
        state: present
        update_cache: true
        lock_timeout: 120

    - name: Create application directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ build_user }}"
        group: "{{ build_user }}"
        mode: "0755"
      loop:
        - "{{ base_dir }}"
        - "{{ site_dir }}"

    - name: Clone Jekyll repository
      become: true
      become_user: "{{ build_user }}"
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ repo_dir }}"
        version: "{{ repo_version }}"
        update: true
        force: true

    - name: Install Bundler
      community.general.gem:
        name: bundler
        version: "4.0.8"
        state: present
        user_install: false

    - name: Configure Bundler install path
      become: true
      become_user: "{{ build_user }}"
      ansible.builtin.command:
        cmd: /usr/local/bin/bundle config set --local path vendor/bundle
        chdir: "{{ app_dir }}"

    - name: Install project gems
      become: true
      become_user: "{{ build_user }}"
      ansible.builtin.command:
        cmd: /usr/local/bin/bundle install
        chdir: "{{ app_dir }}"

    - name: Build static Jekyll site
      become: true
      become_user: "{{ build_user }}"
      ansible.builtin.command:
        cmd: >
          /usr/local/bin/bundle exec jekyll build
          --baseurl {{ base_url }}
          --destination {{ build_dir }}
        chdir: "{{ app_dir }}"

    - name: Deploy Nginx configuration
      ansible.builtin.template:
        src: templates/nginx.conf.j2
        dest: /etc/nginx/sites-available/jekyll-demo
        mode: "0644"
      notify: Reload Nginx

    - name: Enable Jekyll site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/jekyll-demo
        dest: /etc/nginx/sites-enabled/jekyll-demo
        state: link
      notify: Reload Nginx

    - name: Remove default Nginx site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Reload Nginx

    - name: Ensure Nginx is enabled and running
      ansible.builtin.service:
        name: nginx
        enabled: true
        state: started

  handlers:
    - name: Reload Nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded
