---
- name: Deploy Jekyll demo app
  hosts: jekyll_hosts
  become: true

  vars:
    repo_url: "https://github.com/SimpleVM/simplevm-services-demo-jekyll.git"
    repo_version: "fix/deployment"

    app_port: 3838
    location_url: ""

    build_user: "{{ ansible_user }}"

    base_dir: "/srv/jekyll-demo"
    repo_dir: "{{ base_dir }}/repo"
    app_dir: "{{ repo_dir }}/app"
    site_dir: "{{ base_dir }}/site"
    build_dir: "{{ site_dir }}/{{ location_url }}/"

  tasks:
    - name: Fetch latest SimpleVM metadata
      ansible.builtin.shell: bash /etc/simplevm/utils/get_metadata.sh
      changed_when: true

    - name: Read location_url from metadata.json
      ansible.builtin.set_fact:
        location_url_from_metadata: "{{ (lookup('file', '/etc/simplevm/metadata.json', errors='ignore') | default('', true) | from_json | default({})).location_url | default(omit) }}"

    - name: Use location_url from metadata as subpath
      ansible.builtin.set_fact:
        location_url: "{{ location_url_from_metadata }}"
      when:
        - location_url_from_metadata is defined

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true

    - name: Install Ruby and build dependencies
      ansible.builtin.apt:
        name:
          - ruby-full
          - build-essential
          - zlib1g-dev
        state: present

    - name: Ensure GEM_HOME export exists in .bashrc
      become: false
      ansible.builtin.lineinfile:
        path: "/home/{{ ansible_user }}/app/.bashrc"
        line: 'export GEM_HOME="$HOME/gems"'
        create: true

    - name: Ensure gems bin path export exists in .bashrc
      become: false
      ansible.builtin.lineinfile:
        path: "/home/{{ ansible_user }}/app/.bashrc"
        line: 'export PATH="$HOME/gems/bin:$PATH"'
        create: true

    - name: Clone or update Jekyll repository
      become: false
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ repo_dest }}"
        version: "{{ repo_version }}"
        update: true
        force: true

    - name: Install bundler and jekyll into user gem home
      become: false
      ansible.builtin.shell: |
        export GEM_HOME="$HOME/gems"
        export PATH="$HOME/gems/bin:$PATH"
        gem install bundler jekyll
      args:
        executable: /bin/bash

    - name: Install project gems with bundler
      become: false
      ansible.builtin.shell: |
        export GEM_HOME="$HOME/gems"
        export PATH="$HOME/gems/bin:$PATH"
        bundle install
      args:
        chdir: "{{ repo_dest }}/app"
        executable: /bin/bash

    - name: Stop running Jekyll process if present
      ansible.builtin.shell: |
        pkill -f "bundle exec [j]ekyll serve" || true
      changed_when: false

    - name: Build static Jekyll site
      become: true
      become_user: "{{ build_user }}"
      ansible.builtin.command:
        cmd: >
          /usr/local/bin/bundle exec jekyll build
          --baseurl {{ location_url }}
          --destination {{ build_dir }}
        chdir: "{{ app_dir }}"

    - name: Deploy Nginx configuration
      ansible.builtin.template:
        src: templates/nginx.conf.j2
        dest: /etc/nginx/sites-available/jekyll-demo
        mode: "0644"
      notify: Reload Nginx

    - name: Enable Jekyll site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/jekyll-demo
        dest: /etc/nginx/sites-enabled/jekyll-demo
        state: link
      notify: Reload Nginx

    - name: Remove default Nginx site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Reload Nginx

    - name: Ensure Nginx is enabled and running
      ansible.builtin.service:
        name: nginx
        enabled: true
        state: started

  handlers:
    - name: Reload Nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded
