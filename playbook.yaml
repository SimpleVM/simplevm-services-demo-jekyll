---
- name: Deploy Jekyll demo app
  hosts: jekyll_hosts
  become: true

  vars:
    repo_url: "https://github.com/SimpleVM/simplevm-services-demo-jekyll.git"
    repo_version: "master"

    app_port: 3838
    location_url: ""

    base_dir: "/srv/jekyll-demo"
    repo_dir: "{{ base_dir }}/repo"
    app_dir: "{{ repo_dir }}/app"
    site_dir: "{{ base_dir }}/site"

  pre_tasks:
    - name: Check if location_url was passed via -e
      ansible.builtin.set_fact:
        location_url_from_cli: "{{ location_url != '' }}"

  tasks:
    - name: Install Ruby, Nginx and build dependencies
      ansible.builtin.apt:
        name:
          - ruby-full
          - build-essential
          - zlib1g-dev
          - nginx
          - git
          - jq
        state: present
        update_cache: true
        cache_valid_time: 3600
        lock_timeout: 120

    - name: Fetch latest SimpleVM metadata
      ansible.builtin.shell: bash /etc/simplevm/utils/get_metadata.sh
      changed_when: false
      failed_when: false
      when: not location_url_from_cli

    - name: Read location_url from metadata.json
      ansible.builtin.shell: jq -r '.location_url // empty' /etc/simplevm/metadata.json 2>/dev/null
      register: location_url_raw
      changed_when: false
      failed_when: false
      when: not location_url_from_cli

    - name: Use location_url from metadata as subpath
      ansible.builtin.set_fact:
        location_url: "{{ location_url_raw.stdout }}"
      when:
        - not location_url_from_cli
        - location_url_raw is defined
        - location_url_raw.stdout | length > 0

    - name: Ensure location_url is set
      ansible.builtin.assert:
        that: location_url | length > 0
        fail_msg: >-
          location_url is not set.
          Either pass -e "location_url=<subpath>"
          or ensure /etc/simplevm/metadata.json contains a location_url field.
        success_msg: "location_url='{{ location_url }}'"

    - name: Clone Jekyll repository
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ repo_dir }}"
        version: "{{ repo_version }}"
        update: true
        force: true

    - name: Install bundler and project gems
      ansible.builtin.shell: |
        gem install bundler -v 4.0.8 --no-document
        cd {{ app_dir }}
        bundle config set --local path vendor/bundle
        bundle install

    - name: Build static Jekyll site
      ansible.builtin.command:
        cmd: >
          /usr/local/bin/bundle exec jekyll build
          --baseurl /{{ location_url }}
          --destination {{ site_dir }}
        chdir: "{{ app_dir }}"

    - name: Deploy Nginx configuration
      ansible.builtin.template:
        src: templates/nginx.conf.j2
        dest: /etc/nginx/sites-available/jekyll-demo
        mode: "0644"
      notify: Reload Nginx

    - name: Enable Jekyll site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/jekyll-demo
        dest: /etc/nginx/sites-enabled/jekyll-demo
        state: link
      notify: Reload Nginx

    - name: Remove default Nginx site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Reload Nginx

    - name: Ensure Nginx is enabled and running
      ansible.builtin.service:
        name: nginx
        enabled: true
        state: started

  handlers:
    - name: Reload Nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded
